<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Химическая колба-микстурка">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <clipPath id="flask">
      <rect x="13.5" y="6" width="5" height="9"/>
      <circle cx="16" cy="20.2" r="7.6"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <!-- Тело колбы (белое): горлышко + круглая колба -->
  <rect x="13.5" y="6" width="5" height="9" fill="#ffffff"/>
  <circle cx="16" cy="20.2" r="7.6" fill="#ffffff"/>

  <!-- Фиолетовая «микстура» внутри, обрезанная по форме колбы -->
  <g clip-path="url(#flask)">
    <rect x="6" y="17.4" width="20" height="12" fill="url(#liquid)"/>
    <rect x="6" y="17.4" width="20" height="1" fill="#c4b5fd"/>
  </g>

  <!-- Горлышко-венчик -->
  <rect x="11.7" y="4.6" width="8.6" height="2.8" rx="1.4" fill="#ffffff"/>

  <!-- Пузырьки -->
  <circle cx="14.1" cy="21.4" r="1.15" fill="#ffffff" opacity="0.95"/>
  <circle cx="17.7" cy="22.9" r="0.85" fill="#ffffff" opacity="0.9"/>
  <circle cx="16.3" cy="19.3" r="0.7" fill="#ffffff" opacity="0.85"/>
</svg>
